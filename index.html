<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daniel Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Noto+Sans+TC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a teacher's working binder — quick, friendly, organized.
   IDEA: a ring binder with coloured divider tabs; each tab is a category.
   PICTURE: the live, searchable list itself, tabs across the top.
   COLOUR and TYPE: tomato-red cover, charcoal ink, sunflower accent; Lexend + Noto Sans TC.
   LAYOUT: red cover band with title and search, tab row, then card grid. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#17181a);--ink:light-dark(#1f2328,#eceef0);--mute:light-dark(#5b636c,#a3abb3);
--card:light-dark(#ffffff,#212326);--line:light-dark(#e3e5e8,#33363a);
--cover:light-dark(#d9452b,#8f2a19);--sun:#ffc914;--chip:light-dark(#f3f4f6,#2a2d31)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Lexend,"Noto Sans TC",system-ui,sans-serif;overflow-x:clip}
.cover{background:var(--cover);color:#fff;padding:clamp(24px,4vw,48px) max(5vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
h1{font-size:clamp(30px,5vw,46px);line-height:1.05;margin:0;text-wrap:balance;font-weight:700}
.sub{margin:8px 0 18px;opacity:.9;font-size:16px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 260px;position:relative}
.search input{width:100%;font:inherit;font-size:16px;padding:12px 14px 12px 42px;border-radius:12px;border:0;background:#fff;color:#1f2328;min-height:48px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:#5b636c}
.search input:focus{outline:3px solid var(--sun);outline-offset:1px}
select{font:inherit;font-size:16px;min-height:48px;padding:0 12px;border-radius:12px;border:0;background:#fff;color:#1f2328}
select:focus{outline:3px solid var(--sun)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:20px}
.tab{font:inherit;font-size:14px;font-weight:600;border:0;cursor:pointer;min-height:44px;padding:8px 14px;border-radius:12px 12px 0 0;background:rgba(255,255,255,.18);color:#fff;display:flex;gap:8px;align-items:center}
.tab .n{font-size:13px;opacity:.85}
.tab .d{width:10px;height:10px;border-radius:50%;background:var(--c)}
.tab[aria-pressed=true]{background:var(--bg);color:var(--ink)}
.tab:focus-visible{outline:3px solid var(--sun);outline-offset:-3px}
.ctl{font:inherit;font-size:15px;font-weight:600;min-height:48px;padding:0 16px;border-radius:12px;border:0;background:rgba(255,255,255,.18);color:#fff;cursor:pointer}
a.ctl{display:inline-flex;align-items:center;text-decoration:none}
.ctl:focus-visible{outline:3px solid var(--sun)}
details.sec{border-bottom:1px solid var(--line)}
details.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 4px;font-size:20px;font-weight:700}
details.sec>summary::-webkit-details-marker{display:none}
summary .d{width:14px;height:14px;border-radius:50%;background:var(--c);flex:none}
summary .n{font-size:14px;font-weight:600;color:var(--mute);background:var(--chip);border-radius:20px;padding:2px 10px}
summary .chev{margin-left:auto;width:22px;height:22px;transition:transform .2s;color:var(--mute)}
details[open]>summary .chev{transform:rotate(180deg)}
summary:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:8px}
.sec .grid{padding:4px 0 22px}
@media(prefers-reduced-motion:reduce){summary .chev{transition:none}}
main{padding:22px max(5vw,16px) 56px}
.meta{color:var(--mute);font-size:14px;margin:0 0 14px}
.grid{display:flex;flex-direction:column}
.card{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;min-height:52px;padding:6px 0;border-top:1px solid var(--line)}
.card .top{display:none}
.thumb{width:96px;height:60px;border-radius:8px;object-fit:cover;border:1px solid var(--line);flex:none;background:var(--chip)}
.card .tt{flex:1 1 240px}
.card .acts{margin:0;padding:0;flex-wrap:nowrap}
.card .btn{min-height:40px;padding:0 12px}
.top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.tag{font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center;color:var(--mute)}
.tag i{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block}
.date{font-size:13px;color:var(--mute);white-space:nowrap}
.card h3{margin:0;font-size:17px;line-height:1.3;font-weight:600}
.note{margin:0;font-size:14px;color:var(--mute)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.btn{font:inherit;font-size:14px;font-weight:600;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;text-decoration:none}
.btn.go{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.empty{padding:40px 0;color:var(--mute);text-align:center}
.foot{color:var(--mute);font-size:13px;margin-top:28px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
@media(max-width:600px){.tab{padding:8px 10px;font-size:13px}}
.todo{padding:4px 0 22px}
#todo{margin-bottom:6px}
.todo h2{margin:0 0 10px;font-size:20px;display:flex;gap:10px;align-items:center}
.todo h2 .n{font-size:14px;font-weight:600;color:var(--mute);background:var(--chip);border-radius:20px;padding:2px 10px}
.todo form{display:flex;gap:8px;margin-bottom:8px}
.todo input[type=text]{flex:1;font:inherit;font-size:16px;min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.todo input[type=text]:focus{outline:3px solid var(--sun);outline-offset:1px}
.todo ul{list-style:none;margin:0;padding:0}
.todo li{display:flex;align-items:center;gap:10px;min-height:44px;border-top:1px solid var(--line)}
.todo li label{flex:1;display:flex;gap:10px;align-items:center;cursor:pointer;padding:6px 0}
.todo li input{width:20px;height:20px;accent-color:#d9452b;flex:none}
.todo li.done .tx{text-decoration:line-through;color:var(--mute)}
.todo .x{font:inherit;font-size:20px;line-height:1;width:44px;height:44px;border:0;background:none;color:var(--mute);cursor:pointer;border-radius:10px}
.todo .x:focus-visible{outline:3px solid var(--sun)}
.todo .w{font-size:12px;font-weight:700;border-radius:8px;padding:3px 8px;white-space:nowrap;flex:none;min-width:58px;text-align:center}
.todo li.hot .tx::before{content:'Important · ';color:#d9452b;font-weight:700}
.todo li.done .w{opacity:.45}
.todo .hint{margin:6px 0 0;font-size:13px;color:var(--mute)}
.todo form{flex-wrap:wrap}
.todo input[type=time],.todo input[type=date]{font:inherit;font-size:16px;min-height:44px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.todo input[type=date]:focus{outline:3px solid var(--sun);outline-offset:1px}
.todo .hotk{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;min-height:44px;padding:0 6px;cursor:pointer}
.todo .hotk input{width:18px;height:18px;accent-color:#d9452b}
.todo li.msg{color:var(--mute);font-size:14px}
.todo li.over .w{outline:2px solid var(--ink)}
.todo .hint a{color:inherit}
</style>
</head>
<body>
<header class="cover"><div class="wrap">
  <h1>Daniel Hub</h1>
  <div class="bar">
    <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" placeholder="Search" aria-label="Search"></label>
    <a class="ctl" href="https://claude.ai/artifact/B6cSVJSDM2wdFqWiGSRwS3" target="_blank" rel="noopener">Claude version</a>
  </div>
</div></header>
<main><div class="wrap">
  <details class="sec" id="todo" style="--c:#d9452b"><summary><span class="d"></span>To-Do<span class="n" id="todoN">0</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></summary><div class="todo">
    <form id="todoF"><input type="text" id="todoI" placeholder="Add a to-do" aria-label="To-do" maxlength="200">
      <input type="date" id="todoD" aria-label="Date"><input type="time" id="todoT" aria-label="Time (optional)"><label class="hotk"><input type="checkbox" id="todoH2">Important</label><button class="btn go">Add</button></form>
    <ul id="todoL"><li class="msg">Loading…</li></ul><p class="hint" id="todoHint"></p></div></details>
  <div id="secs"></div>
  <p class="foot">Claude Projects have no individual links; the button opens the Projects page.</p>
</div></main>
<div class="toast" id="toast" role="status"></div>
<script>
{
const A='https://claude.ai/artifact/',G='https://github.com/danll737321-beep/',P='https://danll737321-beep.github.io/';
const CATS=[
 {k:'all',n:'All',c:'#ffc914'},
 {k:'github',n:'GitHub',c:'#8b5cf6'},
 {k:'app',n:'Apps',c:'#ffc914'},
 {k:'slides',n:'Slides',c:'#3b82f6'},
 {k:'docs',n:'Docs',c:'#14b8a6'},
 {k:'design',n:'Design',c:'#ec4899'},
 {k:'sheets',n:'Sheets',c:'#22c55e'},
 {k:'project',n:'Projects',c:'#6e7781'}];
const toItem=i=>i.k==='github'?{k:'github',t:i.t,u:G+i.id,p:P+i.id+'/',n:i.n||'',img:'thumbs/'+i.id+'.jpg'}:i.k==='project'?{k:'project',t:i.t,u:'https://claude.ai/projects',n:'Claude Project'}:{k:i.k,t:i.t,u:A+i.id,n:i.n||'',alt:i.alt||''};
let items=[];
const cat=k=>CATS.find(c=>c.k===k);
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cur='all';
const fmt=d=>d?d.slice(5).replace('-','/'):'';
const nm=t=>t.replace(/^[-_]+/,'');
const cmp=(x,y)=>nm(x.t).localeCompare(nm(y.t),'en',{sensitivity:'base',numeric:true});
const chev='<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
const card=i=>{const c=cat(i.k);return `<article class="card" style="--c:${c.c}">
  <div class="top"><span class="tag"><i></i>${c.n}</span></div>
  ${i.img?`<img class="thumb" src="${i.img}" alt="" loading="lazy" onerror="this.remove()">`:''}<div class="tt"><h3>${esc(i.t)}</h3>${i.n?`<p class="note">${esc(i.n)}</p>`:''}</div>
  <div class="acts"><a class="btn go" href="${i.u}" target="_blank" rel="noopener">${i.k==='github'?'Repo':'Open'}</a>
  ${i.p?`<a class="btn" href="${i.p}" target="_blank" rel="noopener">Site</a>`:''}
  ${i.alt?`<a class="btn" href="${A+i.alt}" target="_blank" rel="noopener">Chinese</a>`:''}
  ${i.k!=='project'?`<button class="btn" data-copy="${i.p||i.u}">Copy link</button>`:''}</div></article>`};
let open=new Set();
function render(){
 const q=$('q').value.trim().toLowerCase();
 let tot=0;
 const html=CATS.slice(1).map(c=>{
  const l=items.filter(i=>i.k===c.k&&(!q||(i.t+' '+i.n).toLowerCase().includes(q))).sort(cmp);
  tot+=l.length;if(q&&!l.length)return '';
  const o=q?true:open.has(c.k);
  return `<details class="sec" id="${c.k}" data-k="${c.k}" style="--c:${c.c}"${o?' open':''}><summary><span class="d"></span>${c.n}<span class="n">${l.length}</span>${chev}</summary><div class="grid">${l.map(card).join('')}</div></details>`}).join('');
 $('secs').innerHTML=html||'<p class="empty">No matches. Try another word.</p>';
}
$('secs').addEventListener('toggle',e=>{const d=e.target;if(!d.dataset||!d.dataset.k||$('q').value.trim())return;d.open?open.add(d.dataset.k):open.delete(d.dataset.k)},true);
$('q').addEventListener('input',render);
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1600)}
$('secs').addEventListener('click',async e=>{const b=e.target.closest('[data-copy]');if(!b)return;
 try{await navigator.clipboard.writeText(b.dataset.copy);toast('Link copied')}catch(_){toast('Couldn’t copy. Long-press Open to copy.')}});
const h=location.hash.slice(1);if(CATS.some(c=>c.k===h))open.add(h);
$('secs').innerHTML='<p class="empty">Loading…</p>';
fetch('items.json',{cache:'no-cache'}).then(r=>r.json()).then(j=>{items=j.items.map(toItem);render()}).catch(()=>{$('secs').innerHTML='<p class="empty">Couldn’t load the list. Reload to try again.</p>'});
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=()=>iso(new Date());
const DC=[['#ea580c','#fff'],['#2563eb','#fff'],['#0d9488','#fff'],['#7c3aed','#fff'],['#f59e0b','#1f2328'],['#16a34a','#fff'],['#db2777','#fff']];
const dc=w=>{const d=new Date(w+'T12:00');if(isNaN(d))return '';const[b,f]=DC[d.getDay()];return `background:${b};color:${f}`};
const wk=w=>{if(!w)return '';const d=new Date(w+'T12:00');return isNaN(d)?'':`${d.getMonth()+1}/${d.getDate()} ${WD[d.getDay()]}`};
let todos=[],store=null,ready=false;
const tmOf=x=>{if(x.tm)return x.tm;const m=String(x.s||'').match(/(\d{1,2}):(\d{2})\s*(am|pm)?/i);if(!m)return '00:00';let h=+m[1];const ap=(m[3]||'').toLowerCase();
 if(ap==='pm'&&h<12)h+=12;else if(ap==='am'&&h===12)h=0;else if(!ap&&h>=1&&h<=7)h+=12;return String(h).padStart(2,'0')+':'+m[2]};
$('todoD').value=today();
const HUB='https://claude.ai/artifact/B6cSVJSDM2wdFqWiGSRwS3';
function renderT(){
 if(!ready){return}
 const t0=today();
 const l=todos.filter(x=>!x.del&&!(x.w&&x.w<t0)).sort((a,b)=>(a.done||0)-(b.done||0)||(a.w||'9').localeCompare(b.w||'9')||tmOf(a).localeCompare(tmOf(b))||(b.hot||0)-(a.hot||0)||(a.t||0)-(b.t||0));
 $('todoN').textContent=l.filter(x=>!x.done).length;
 $('todoL').innerHTML=l.length?l.map(x=>`<li class="${x.done?'done':''}${x.hot&&!x.done?' hot':''}${!x.done&&x.w&&x.w<t0?' over':''}"><label><input type="checkbox" data-id="${esc(x.id)}"${x.done?' checked':''}>${x.w?`<span class="w" style="${dc(x.w)}">${wk(x.w)}</span>`:''}<span class="tx">${esc(String(x.s||''))}</span></label><button class="x" data-del="${esc(x.id)}" aria-label="Delete">×</button></li>`).join(''):'<li class="msg">Nothing to do right now.</li>';
}
const local={
 load(){try{return JSON.parse(localStorage.getItem('dhub-todo')||'[]')}catch(_){return []}},
 save(){try{localStorage.setItem('dhub-todo',JSON.stringify(todos))}catch(_){}},
 async put(x){const i=todos.findIndex(o=>o.id===x.id);i<0?todos.push(x):todos[i]=x;this.save();renderT()},
 async patch(id,p){const x=todos.find(o=>o.id===id);if(x){Object.assign(x,p);this.save();renderT()}}
};
function useLocal(note){store=local;todos=local.load();ready=true;$('todoHint').innerHTML=note;renderT()}
const flog=()=>toast('Didn’t save. Please try again.');
$('todoF').addEventListener('submit',async e=>{e.preventDefault();if(!store)return;const v=$('todoI').value.trim();if(!v)return;
 const tv=$('todoT').value;const x={id:'u'+Date.now(),s:tv?`${v} ${tv}`:v,tm:tv||'',w:$('todoD').value||today(),hot:$('todoH2').checked?1:0,done:0,del:0,t:Date.now(),src:'me'};
 $('todoI').value='';$('todoT').value='';$('todoH2').checked=false;$('todoD').value=today();
 try{await store.put(x)}catch(_){flog()}});
$('todoL').addEventListener('change',async e=>{const id=e.target.dataset.id;if(!id||!store)return;try{await store.patch(id,{done:e.target.checked?1:0})}catch(_){flog()}});
$('todoL').addEventListener('click',async e=>{const b=e.target.closest('[data-del]');if(!b||!store)return;
 try{await store.patch(b.dataset.del,{del:1});toast('Deleted. It won’t come back.')}catch(_){flog()}});
if(window.claude&&window.claude.use){
 (async()=>{let db=null;try{db=await window.claude.use('db')}catch(_){}
  if(!db){useLocal('Can’t reach the cloud right now. To-dos are saved in this browser for now.');return}
  const col=db.collection('todos');
  store={put:x=>{const{id,...b}=x;return col.doc(id).set(b)},patch:(id,p)=>col.doc(id).update(p)};
  const tm=setTimeout(()=>{if(!ready){ready=true;$('todoHint').textContent='Can’t reach the cloud right now. Try again later.';renderT()}},10000);
  col.onSnapshot(sn=>{todos=sn.docs.map(d=>({id:d.id,...d.data()}));if(!sn.metadata.fromCache){clearTimeout(tm);$('todoHint').textContent='Updated every morning from Calendar and Gmail · deleted items stay deleted · synced across devices'}ready=true;renderT()},
   ()=>{clearTimeout(tm);ready=true;$('todoHint').textContent='Lost the cloud connection. Reload the page to try again.';renderT()});
 })();
}else{
 useLocal(`To-dos here are saved only in this browser. The daily-updated, synced list is in <a href="${HUB}" target="_blank" rel="noopener">Daniel Hub on Claude</a>.`);
}
}
</script>
</body>
</html>
